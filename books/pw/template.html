<!--__FONTS__-->
<style>
:root{
  --bg:#f4f2ee;--surface:#fffdf9;--ink:#1d1f24;--muted:#5f636b;--line:#dcd7cd;--soft:#ece7dd;
  --accent:#8a3b22;--accent-soft:#f3e6df;
  --p1:#9a6a1c;--p2:#7b3f78;--p3:#2c7062;--p4:#3a5a9c;--p5:#a0372b;--p6:#5d6b1f;--p7:#2f6f8f;
  --land:#ebe4d4;--landline:#b9ad94;--border:#b5a98f;--sea:#dfe8ec;--grat:#cdd8dd;--river:#6f9cbf;
  --hl:#fff0b0;--warn:#8a5a00;--warn-soft:#fbf1dc;
  --sans:"KRSans","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:var(--sans);
  --fs:17px;--measure:44rem;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417;--surface:#1a1d21;--ink:#e6e3dc;--muted:#a3a7ad;--line:#2e3238;--soft:#23272c;
  --accent:#e59a7b;--accent-soft:#33241f;
  --p1:#d9a650;--p2:#c98ac5;--p3:#6cc2ad;--p4:#8fa9e6;--p5:#ec8577;--p6:#b7c46a;--p7:#7fb6d3;
  --land:#262a2f;--landline:#4a4f56;--border:#565c64;--sea:#15191d;--grat:#22282e;--river:#4f7896;
  --hl:#5b4b10;--warn:#e8b45a;--warn-soft:#2c2414;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417;--surface:#1a1d21;--ink:#e6e3dc;--muted:#a3a7ad;--line:#2e3238;--soft:#23272c;
  --accent:#e59a7b;--accent-soft:#33241f;
  --p1:#d9a650;--p2:#c98ac5;--p3:#6cc2ad;--p4:#8fa9e6;--p5:#ec8577;--p6:#b7c46a;--p7:#7fb6d3;
  --land:#262a2f;--landline:#4a4f56;--border:#565c64;--sea:#15191d;--grat:#22282e;--river:#4f7896;
  --hl:#5b4b10;--warn:#e8b45a;--warn-soft:#2c2414;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.75;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
h1{font-weight:800}
svg text{font-family:var(--sans)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{line-height:1.35;letter-spacing:-.01em;text-wrap:balance}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 상단 막대 */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:.4rem;padding:.4rem 16px}
.brand{font-weight:800;color:var(--ink);white-space:nowrap;font-family:var(--serif)}
.brand:hover{text-decoration:none}
.sp{flex:1}
.ib{flex:none;width:2.1rem;height:2.1rem;display:grid;place-items:center;border:0;background:transparent;border-radius:8px;cursor:pointer}
.ib:hover{background:var(--accent-soft)}
.ib svg{width:1.2rem;height:1.2rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sbox{display:flex;align-items:center;gap:.35rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem;flex:0 1 14rem;min-width:0}
.sbox svg{width:1rem;height:1rem;fill:none;stroke:var(--muted);stroke-width:2;flex:none}
.sbox input{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.86rem;width:100%;min-width:0;padding:.25rem 0;outline:none}
.tabs{display:flex;gap:.2rem;padding:0 12px .35rem;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;font-size:.86rem;color:var(--muted);padding:.25rem .7rem;border-radius:999px}
.tabs a:hover{text-decoration:none;background:var(--soft);color:var(--ink)}
.tabs a.on{background:var(--ink);color:var(--bg);font-weight:700}
@media (max-width:640px){.sbox{flex:1;min-width:5.5rem}.brand{flex:none;font-size:.86rem;line-height:1.2;white-space:normal;width:7.4em;word-break:keep-all}}
@media (max-width:350px){.sbox{min-width:2.6rem}.brand{width:6.6em;font-size:.8rem}.bar1{gap:.2rem;padding:.4rem 10px}}

/* 서랍 차례 */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.35);z-index:30}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(22rem,88vw);background:var(--surface);z-index:31;overflow:auto;padding:1rem 1rem 2rem;border-right:1px solid var(--line)}
.dh{display:flex;justify-content:space-between;align-items:center}
.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.12rem .7rem;font-size:.8rem;cursor:pointer;color:var(--ink)}
.pill:hover{background:var(--soft)}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toc{list-style:none;margin:0;padding:0}
.toc .tp{font-size:.76rem;color:var(--muted);margin:1rem 0 .2rem;font-weight:700}
.toc a{display:flex;gap:.55rem;padding:.25rem .4rem;border-radius:6px;color:var(--ink);font-size:.88rem;line-height:1.45}
.toc a:hover{background:var(--soft);text-decoration:none}
.toc a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.n{flex:none;width:2.1em;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rd{flex:none;width:.45rem;height:.45rem;border-radius:50%;margin-top:.55rem;background:transparent}
.rd.on{background:var(--p3)}

/* 검색 결과, 용어 상자 */
.results{position:fixed;z-index:25;top:6.2rem;left:50%;transform:translateX(-50%);width:min(44rem,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgb(0 0 0/.16);padding:.5rem}
.results ol{list-style:none;margin:0;padding:0}
.results li a{display:block;padding:.45rem .6rem;border-radius:8px;color:var(--ink)}
.results li a:hover{background:var(--soft);text-decoration:none}
.results small{color:var(--muted);display:block;font-size:.8rem;line-height:1.5}
.results mark,.hit{background:var(--hl);color:inherit;border-radius:2px}
.pop{position:fixed;z-index:40;max-width:min(22rem,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgb(0 0 0/.18);padding:.7rem .85rem;font-size:.9rem;line-height:1.6}
.pop b{display:block;margin-bottom:.15rem}
/* 용어는 글줄 속 인라인 요소로 둔다(단추로 두면 통째로 넘어가 양쪽 정렬에서 낱말 사이가 크게 벌어짐) */
.term{display:inline;color:inherit;border-bottom:1px dotted var(--accent);cursor:help;-webkit-box-decoration-break:clone;box-decoration-break:clone;-webkit-tap-highlight-color:transparent}
.term:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px}

/* 읽기 기둥 */
main{padding:0 16px 5rem}
.col{max-width:var(--measure);margin:0 auto}
.wide{max-width:1180px;margin:0 auto}
.eyebrow{font-size:.8rem;color:var(--muted);letter-spacing:.03em;margin:2rem 0 .2rem;font-weight:600}
.hero h1{font-family:var(--serif);font-size:2.1rem;margin:.2rem 0 .4rem}
.lede{font-size:1.05rem;color:var(--ink)}
.sub{color:var(--muted);margin:0}
h2.sh{font-size:1.15rem;margin:2.4rem 0 .6rem;padding-top:.6rem;border-top:1px solid var(--line)}
.lbl{font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.04em;margin:0 0 .3rem}
.grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.85rem 1rem;color:var(--ink)}
a.card:hover{text-decoration:none;border-color:var(--muted)}
.card h3{font-size:1rem;margin:0 0 .2rem}
.card p{margin:0;font-size:.9rem;color:var(--muted);line-height:1.6}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:.05rem .55rem;color:var(--muted);background:var(--surface);white-space:nowrap}
a.chip:hover{text-decoration:none;color:var(--ink);border-color:var(--muted)}
.chip i{width:.55rem;height:.55rem;border-radius:50%;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}

/* 부 목록 */
.part{margin-top:1.6rem}
.part h3{font-size:1.05rem;margin:0;display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.part h3 em{font-style:normal;color:var(--muted);font-size:.82rem;font-weight:500}
.clist{list-style:none;margin:.5rem 0 0;padding:0;border-top:1px solid var(--line)}
.clist a{display:flex;gap:.6rem;align-items:baseline;padding:.42rem .2rem;border-bottom:1px solid var(--line);color:var(--ink)}
.clist a:hover{background:var(--soft);text-decoration:none}
.clist .t{flex:1;min-width:0}
@media (max-width:640px){.tbl.cmp{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}.tbl.cmp th,.tbl.cmp td{min-width:9rem}}
.clist small{color:var(--muted);font-size:.8rem;white-space:nowrap}
.pbar{display:inline-block;width:.6rem;height:.6rem;border-radius:2px;flex:none}
.meter{height:.5rem;background:var(--soft);border-radius:999px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}

/* 장 */
.chead h1{font-family:var(--serif);font-size:1.75rem;margin:.1rem 0}
.chead .cn{display:block;font-size:.85rem;color:var(--muted);font-family:var(--sans);font-weight:600}
.period{color:var(--muted);margin:.1rem 0 .5rem}
.q{font-family:var(--serif);font-size:1.12rem;border-left:3px solid var(--accent);padding:.1rem 0 .1rem .9rem;margin:1rem 0}
.keys{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.9rem 1.1rem;margin:1.2rem 0}
.keys p{margin:0}
.keys.guide{background:transparent;border-style:dashed}.keys.guide .rh p{margin:.5rem 0 0}.keys.guide .rh h4{margin:.8rem 0 .2rem;font-size:.95rem}
.slot{margin:1.6rem 0}
.slot h2{font-size:1.1rem;margin:0 0 .3rem}
.todo{border:1px dashed var(--line);border-radius:10px;padding:.55rem .8rem;color:var(--muted);font-size:.88rem;background:transparent}
.todo b{color:var(--warn);font-weight:700;margin-right:.35rem}
.box{border-radius:12px;padding:.8rem 1rem;margin:1.4rem 0}
.box.deb{background:var(--warn-soft)}
.box.myth{background:var(--accent-soft)}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;font-size:.8rem}
.links{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:560px){.links{grid-template-columns:1fr}}
.links ul{list-style:none;margin:0;padding:0}
.links li a{display:block;padding:.3rem .5rem;border-radius:8px;border:1px solid var(--line);margin-bottom:.35rem;background:var(--surface);color:var(--ink);font-size:.9rem;line-height:1.45}
.links li a:hover{text-decoration:none;border-color:var(--muted)}
.links small{color:var(--muted)}
.minimap{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);background:var(--sea)}
.go{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}
.pn{display:flex;justify-content:space-between;gap:1rem;margin-top:2.5rem;border-top:1px solid var(--line);padding-top:1rem}
.pn a{max-width:48%;color:var(--ink)}
.pn small{display:block;color:var(--muted);font-size:.78rem}
.pn .next{text-align:right;margin-left:auto}
.bg5{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));margin-top:.6rem}
.bg5 .card{border-top:3px solid var(--line)}
.bg5 .pe{border-style:dashed}
.bg5 .card{display:flex;flex-direction:column}.bg5 .card>p{flex:1}.bg5 .rgo{margin:.5rem 0 0!important}.bg5 .rgo .pill{font-size:.8rem}

/* 지도 */
.stage{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none}
.stage svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:2rem;height:2rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.mk{cursor:pointer}
.mk circle{stroke:var(--surface);stroke-width:1.5}
.mk text{font-size:9px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk.dim{opacity:.18}
.mk.sel circle{stroke:var(--ink);stroke-width:2.5}
.bd{stroke:var(--border);stroke-width:.55;stroke-linejoin:round;opacity:.7}
.noborders .bd{display:none}
.pv{stroke:var(--landline);stroke-width:.45;stroke-dasharray:2 2;opacity:.55}
.rv{stroke:var(--river);stroke-width:.8;opacity:.75;stroke-linecap:round;stroke-linejoin:round}
.lk{fill:var(--sea);stroke:var(--river);stroke-width:.4;opacity:.9}
.noprov .pv,.norivers .rv,.norivers .lk{display:none}
.lay-ports circle{fill:var(--surface);stroke:#8a3b22;stroke-width:1.4;vector-effect:non-scaling-stroke}
.lay-ports text,.lay-lease text,.lay-city text{fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:2.5px;stroke-linejoin:round;font-weight:600}
.lay-ports .yr{fill:#8a3b22;font-weight:700}
.lay-lease rect{fill:#7b3f78;opacity:.85;vector-effect:non-scaling-stroke}
.lay-city circle{fill:var(--ink);opacity:.6}
.noports .lay-ports,.nolease .lay-lease{display:none}
.mleg .sw2{display:inline-block;width:.7rem;height:.7rem;margin-right:.3rem;vertical-align:-1px}
.lbl-sea{font-size:12px;fill:var(--muted);font-style:italic;text-anchor:middle;opacity:.8}
.lbl-reg{font-size:15px;font-weight:800;fill:var(--muted);text-anchor:middle;opacity:.35;letter-spacing:.1em}
.ctrl{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:.8rem 0}
.ctrl .lb{font-size:.8rem;color:var(--muted);margin-right:.2rem}
.info{margin-top:.8rem}
.note{font-size:.84rem;color:var(--muted)}

/* 연표 */
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.scroller svg{display:block}
.ln-name{font-size:12px;font-weight:700;fill:var(--ink)}
.tick{font-size:10.5px;fill:var(--muted);text-anchor:middle}
.dot{cursor:pointer}
.dot text{font-size:9px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dot.dim{opacity:.2}
.dot.sel circle{stroke:var(--ink);stroke-width:2.5}
.arc{fill:none;stroke:var(--muted);stroke-width:1;opacity:.18}
.arc.on{stroke:var(--accent);stroke-width:2;opacity:.95}
.arc.in{stroke:var(--p4);stroke-width:2;opacity:.95}

/* 연결망 */
.nd{cursor:pointer}
.nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.nd.c rect{stroke:var(--accent);stroke-width:2.5;fill:var(--accent-soft)}
.nd text{font-size:11.5px;fill:var(--ink)}
.nd .yy{font-size:10px;fill:var(--muted)}
.ed{fill:none;stroke:var(--muted);stroke-width:1.2;opacity:.55}
@media (max-width:560px){.clist a{gap:.45rem}.clist small{white-space:normal;text-align:right;flex:0 1 6.5rem;min-width:0;line-height:1.35}}
.chip{max-width:100%;white-space:normal}
@media (max-width:560px){.tbl th,.tbl td{padding:.35rem .3rem;overflow-wrap:anywhere}}
/* 지역별 이어 읽기 */
.trail{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:1.2rem 0 -.6rem;padding:.5rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.trail .tt{color:var(--ink);font-weight:700;line-height:1.3}.trail .tt small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.trail .tk{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.trail .meter{flex:1;min-width:6rem;margin:0}
.trail .tx{font-size:.8rem}
.meter{height:.4rem;border-radius:999px;background:var(--soft);overflow:hidden;margin:.6rem 0 .2rem}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.tg{display:inline-block;margin-left:.4rem;font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 .4rem;vertical-align:2px}
/* 공통: 화면 제목과 연결 이유 */
.vt{font-family:var(--serif);font-size:1.55rem;margin:.2rem 0 .3rem}
.vsub{margin:.1rem 0 .4rem;max-width:52rem}
.why{display:block;font-size:.82rem;color:var(--muted);margin-top:.15rem;line-height:1.55}
.links li a .n,.mlist .n{display:inline-grid;place-items:center;min-width:1.55rem;height:1.55rem;padding:0 .3rem;border-radius:999px;color:#fff;font-size:.72rem;font-weight:700;margin-right:.2rem;vertical-align:1px}
.links.one{display:block}
.links.one .lbl{margin-top:.9rem}
i.ln{display:inline-block;width:1.1rem;height:0;border-top:2.5px solid;vertical-align:middle;margin-right:.35rem}
i.ln.in{border-color:var(--p4)}i.ln.out{border-color:var(--accent)}
.sel{font:inherit;font-size:.85rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;max-width:min(100%,24rem)}
.pill[disabled]{opacity:.4;cursor:default}
/* 연결망 범주 */
.netcat{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:.5rem .7rem;margin:.2rem 0 .6rem}
.nc-row{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.nc-row .lb{font-size:.8rem;color:var(--muted);margin-right:.2rem}
.nc-m{margin-top:.45rem;padding-top:.45rem;border-top:1px dashed var(--line)}
.nc-m .pill small{color:var(--muted);margin-left:.15rem}.nc-m .pill.on small{color:inherit;opacity:.8}
.nc-m .sw{display:inline-block;width:.55rem;height:.55rem;border-radius:2px;margin-right:.3rem}
.nc-x{margin-left:auto}
.nc-d{font-size:.84rem;color:var(--muted);margin:.5rem 0 .3rem}
.nc-list{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(15rem,100%),1fr));gap:.25rem .6rem;max-height:11.5rem;overflow:auto}
.nc-list a{display:flex;gap:.45rem;align-items:baseline;padding:.15rem .35rem;border-radius:6px;color:var(--ink);font-size:.86rem;line-height:1.4}
.nc-list a:hover{background:var(--soft);text-decoration:none}
.nc-list a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nc-list .n{width:2.1em}

.ulbar button+button{border-left:1px solid color-mix(in srgb,var(--bg) 25%,transparent);border-radius:0 999px 999px 0}
.ullist{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}
.ullist li{display:grid;grid-template-columns:1fr auto;gap:.2rem .6rem;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem}
.ullist li>a{grid-column:1;color:var(--ink);line-height:1.7}.ullist li>a:hover{text-decoration:none}
.ullist .ulm{grid-column:1;font-size:.74rem;color:var(--muted)}
.ullist .ul-x{grid-column:2;grid-row:1/span 2;align-self:center;font-size:.76rem}
.gori{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem;margin:.45rem 0 0;font-size:.8rem}
.gori .lb{color:var(--muted);margin-right:.2rem}
.gch{display:inline-block;padding:.05rem .55rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.gch.g-top{border-color:#3a5a9c;color:#3a5a9c}.gch.g-bot{border-color:#2c7062;color:#2c7062}.gch.g-out{border-color:#a0372b;color:#a0372b}
:root[data-theme="dark"] .gch{filter:brightness(1.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gch{filter:brightness(1.5)}}
.ga{color:var(--muted)}

.kd{display:inline-flex;align-items:center;gap:.3rem;font-size:.78rem;font-weight:700;padding:.05rem .55rem;border-radius:999px;border:1px solid currentColor}
.kd-ev{color:#3a5a9c}.kd-eco{color:#2c7062}.kd-cul{color:#a0372b}.kd-air{color:#8a5a1c}
:root[data-theme="dark"] .kd{filter:brightness(1.6)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kd{filter:brightness(1.6)}}
.kdm{flex:none;align-self:flex-start;margin-top:.1rem;height:auto;font-size:.68rem;font-weight:700;line-height:1;padding:.2rem .4rem;display:inline-flex;align-items:center;white-space:nowrap;border-radius:4px;border:1px solid currentColor;opacity:.9}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(15rem,100%),1fr));gap:.5rem;margin:.6rem 0}
.words div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;font-size:.92rem;line-height:1.55}
.words b{display:block;font-size:1rem;color:var(--ink)}
.works td:first-child{font-weight:700;white-space:nowrap}
@media (max-width:560px){.works td:first-child{white-space:normal}}
.echart{display:block;width:100%;height:auto;min-width:720px}
.echart text{font-size:12px;fill:var(--muted)}
.echart .tt{font-size:14px;font-weight:700;fill:var(--ink)}
.echart .mk{font-size:11px;fill:var(--accent);font-weight:700}
.echart a:hover .mk{text-decoration:underline}
.ebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.6rem .6rem .2rem;margin:.9rem 0}
.ebox .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;border:0;background:none;padding:0}
.ebox p.note{margin:.2rem .3rem .5rem}
.airpart{border-top:3px solid var(--pc);padding-top:.4rem}
.mood{font-size:1.02rem;line-height:1.85}
</style>
</head>
<body>
<header class="bar">
 <div class="bar1">
  <button class="ib" id="bToc" aria-label="차례 열기" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <a class="brand" href="#/">__TITLE__</a>
  <span class="sp"></span>
  <label class="sbox"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span class="vh">찾기</span><input id="q" type="search" placeholder="장, 인물, 용어 찾기" autocomplete="off"></label>
  <button class="ib" id="bFont" aria-label="글자 크기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-12 5 12M5.8 14h6.4M15 18l3-7.5 3 7.5M15.9 16h4.2"/></svg></button>
  <button class="ib" id="bTheme" aria-label="밝기 전환"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
 </div>
 <nav class="tabs" id="tabs" aria-label="화면">
  <a href="#/" data-v="home">읽기</a><a href="#/map" data-v="map">지도</a><a href="#/lanes" data-v="lanes">무대 연표</a><a href="#/net" data-v="net">사건 연결망</a><a href="#/pp" data-v="pp">인물</a><a href="#/id" data-v="id">사람들의 변화</a><a href="#/econ" data-v="econ">경제 지표</a><a href="#/air" data-v="air">시대의 공기</a><a href="#/ln" data-v="ln">요소별 변천</a><a href="#/t" data-v="t">줄기</a><a href="#/books" data-v="books">서가</a><a href="#/terms" data-v="terms">용어</a>
 </nav>
</header>
<div class="scrim" id="scrim" hidden></div>
<nav class="drawer" id="drawer" aria-label="차례" hidden><div class="dh"><b>차례</b><button class="pill" id="dclose">닫기</button></div><ol class="toc" id="toc"></ol></nav>
<div class="results" id="results" hidden></div>
<div class="pop" id="pop" hidden></div>
<main id="main"></main>
<script>
(function(){
'use strict';
/*__DATA__*/
const DRAFT=!!(DATA.meta&&DATA.meta.draft);
const todo=t=>DRAFT?`<div class="todo"><b>집필 예정</b>${t}</div>`:'';
const NUMW=['영','한','두','세','네','다섯','여섯','일곱','여덟','아홉','열','열한','열두','열세','열네','열다섯'];
const kn=n=>NUMW[n]||String(n);
const PFX=((DATA.meta&&DATA.meta.pfx)||'bk')+'-';
// 장 머리 분량 표시: 빌드가 계산한 META.wl, 없으면 여기서 계산한다(등급별 중앙값, 100자 반올림, 문자열만 센다)
const WLC=(()=>{const SL=v=>typeof v==='string'?v.length:Array.isArray(v)?v.reduce((a,x)=>a+SL(x),0):0;const by={};(DATA.events||[]).forEach(e=>{const b=DATA.body&&DATA.body[e.id];if(b)(by[e.w]=by[e.w]||[]).push(SL(Object.values(b)));});const med=a=>{const c=[...a].sort((x,y)=>x-y);return c[Math.floor((c.length-1)/2)];};return Object.fromEntries(Object.entries(by).map(([w,a])=>[w,'약 '+(Math.round(med(a)/100)*100).toLocaleString('en-US')+'자']));})();

// 자료가 없는 화면은 메뉴에서 숨긴다(LIBRARY U8)
(function(){const M=DATA.meta||{};const has={map:!M.nomap,lanes:!M.nolanes&&!!(DATA.regions&&DATA.regions.length),pp:!!(DATA.people&&DATA.people.length),id:!!(DATA.groups&&DATA.groups.length),ln:!!(DATA.lineage&&DATA.lineage.length),t:!!(DATA.threads&&DATA.threads.length),econ:!!DATA.econ,air:!!DATA.econ};
 document.querySelectorAll('#tabs a[data-v]').forEach(a=>{if(a.dataset.v in has&&!has[a.dataset.v])a.hidden=true;});})();
const $=s=>document.querySelector(s), main=$('#main');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mem={};
const store={get(k,v){try{const x=localStorage.getItem('pw-'+k);return x===null?v:JSON.parse(x)}catch(e){return k in mem?mem[k]:v}},
             set(k,v){mem[k]=v;try{localStorage.setItem('pw-'+k,JSON.stringify(v))}catch(e){}}};

// ── 색인
const E={},P={},G={},B={},R={},AX={};
DATA.events.forEach(e=>{E[e.id]=e;e.pv=[];});
DATA.events.forEach(e=>e.nx.forEach(n=>E[n].pv.push(e.id)));
DATA.parts.forEach((p,i)=>{P[p.id]=p;p.i=i;p.ev=DATA.events.filter(e=>e.p===p.id);});
DATA.groups.forEach(g=>G[g.id]=g);DATA.books.forEach(b=>{B[b.id]=b;b.ev=[];});
DATA.events.forEach(e=>e.bk.forEach(([b,ch])=>{if(!B[b].ev.find(x=>x[0]===e.id))B[b].ev.push([e.id,ch]);}));
DATA.regions.forEach(r=>R[r.id]=r);DATA.axes.forEach(a=>AX[a.id]=a);
const PE={},PN={},FC={};DATA.people.forEach(p=>{PE[p.id]=p;[p.n,...(p.al||[])].forEach(n=>PN[n]=p.id);});DATA.facts.forEach(f=>FC[f[0]]=f);
const pcol=p=>FC[p.f][2];
const plife=p=>`${p.life[0]??'?'}–${p.life[1]??''}`;
const fchip=p=>`<span class="fchip" style="--pc:${pcol(p)}"><i class="fdot"></i>${esc(FC[p.f][1])}</span>`;
const chOf={};DATA.groups.forEach(g=>g.ch.forEach(([ev,ax,t])=>(chOf[ev]=chOf[ev]||[]).push({g:g.id,ax,t})));
const pc=id=>`var(--${id})`;
const ECOL=e=>pc(e.p);
const WN={1:'핵심',2:'주요',3:'보조'},WL=(DATA.meta&&DATA.meta.wl)||WLC;
const KN=Object.fromEntries((DATA.kinds||[]).map(k=>[k[0],k[1]]));const KM={ev:'사',eco:'경',cul:'문',air:'공'};
const SLOTH={eco:{원인:'왜 그렇게 되었나',주체:'누가 움직였나'},cul:{원인:'토양',주체:'작품과 사람',전개:'흐름'},air:{원인:'분위기를 만든 것',주체:'그 시대를 산 사람들',전개:'장면들'}};
const kdBadge=e=>e.kd&&KN[e.kd]?`<span class="kd kd-${e.kd}">${esc(KN[e.kd])} 장</span>`:'';
const yfmt=y=>y<0?`기원전 ${-y}`:String(y);

// ── 읽은 장
let READ=store.get('read',{});
const markRead=id=>{if(!READ[id]){READ[id]=Date.now();store.set('read',READ);}};

// ── 용어 자동 연결: 한 덩어리 글에서 용어마다 처음 한 번만
const TERM_RE=new RegExp('('+[...DATA.terms.map(t=>t[0]),...Object.keys(PN)].filter(t=>!/[()]/.test(t)).sort((a,b)=>b.length-a.length).map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');
const TDEF=Object.fromEntries(DATA.terms);
function rich(text){return linky(text.replace(/\[\[(\w+)\]\]/g,'\u0001$1\u0002')).replace(/\u0001(\w+)\u0002/g,(m,id)=>E[id]?`<a class="ref" href="#/e/${id}">(${E[id].no}장)</a>`:'');}
const HG=/[가-힣]/;
// 짧은 용어 뒤에 붙은 말이 조사(들)로만 이루어지고 거기서 낱말이 끝날 때만 연결 (샤를마뉴·업적·알리가르 같은 경우를 걸러 냄)
const PTC=/^(?:으로서|으로써|으로|로서|로써|에서|에게서|에게|한테|까지|부터|처럼|보다|마다|조차|이나|이라는|이라|라는|이었다|이었|이며|이고|이자|이다|였다|였|에는|은|는|이|가|을|를|의|에|와|과|로|도|만|들|께|라|란|인)+(?![가-힣])/;
// 같은 글자가 다른 사람·뜻으로 쓰이는 자리: [왼쪽 문맥, 오른쪽 문맥]
const TERM_DENY={
 ...Object.fromEntries(Object.entries(DATA.pdeny).map(([k,[l,r]])=>[k,[l&&new RegExp(l),r&&new RegExp(r)]])),
 '위원':[/(상무|중앙|정치국|군사)\s*$/,/^(장|회)/],
 '신사':[null,/^(층의|층이|층은|층을|층)/]
};
let PSEEN=null;
function linky(text){const seen=PSEEN||new Set();return esc(text).replace(TERM_RE,(m,_g,off,str)=>{if(seen.has(m))return m;
 const pv=str[off-1]||'',nx=str.slice(off+m.length);
 if(m.length<=3){if(pv&&HG.test(pv))return m;if(nx&&HG.test(nx[0])&&!PTC.test(nx))return m;}
 const dn=TERM_DENY[m];if(dn){const L=str.slice(Math.max(0,off-16),off);if((dn[0]&&dn[0].test(L))||(dn[1]&&dn[1].test(nx)))return m;}
 seen.add(m);if(PN[m]){const p=PE[PN[m]];return `<span class="term person" style="--pc:${pcol(p)}" role="button" tabindex="0" data-p="${p.id}">${m}</span>`;}return `<span class="term" role="button" tabindex="0" data-t="${esc(m)}">${m}</span>`;});}

// ── 공통 조각
const regChips=e=>e.r.map(r=>`<a class="chip" href="#/rr/${r}">${esc(R[r].n)}</a>`).join('');
const btitle=b=>b.lang==='en'?'<i>'+esc(b.t)+'</i>':'『'+esc(b.t)+'』';
const evLink=(id,extra)=>{const e=E[id];return `<a href="#/e/${id}"><span class="n">${e.no}</span> ${esc(e.t)} <small>${esc(e.y)}${extra?' · '+esc(extra):''}</small></a>`;};
const statusMeter=()=>{const n=DATA.events.length;return `<div class="meter" aria-hidden="true"><i style="width:100%;background:var(--line)"></i></div><p class="note">사건 장 ${n}개 모두 <b>${esc(DATA.status)}</b> 단계입니다. 요지·연결·근거 도서·정체성 변화는 채워져 있고, 본문 서술 칸은 집필 예정입니다.</p>`;};

// ── 차례 서랍
function buildToc(cur){
  $('#toc').innerHTML=DATA.parts.map(p=>`<li class="tp">${esc(p.no)} ${esc(p.t)}</li><li><a href="#/p/${p.id}" class="${cur===p.id?'on':''}"><span class="n">序</span><span>배경: ${esc(p.y)}</span></a></li>`+
    p.ev.map(e=>`<li><a href="#/e/${e.id}" class="${cur===e.id?'on':''}"><span class="n">${e.no}</span><span style="flex:1">${esc(e.t)}</span>${e.kd&&e.kd!=='ev'?`<span class="kdm kd-${e.kd}" title="${esc(KN[e.kd])} 장">${esc(KN[e.kd]||'')}</span>`:''}<span class="rd ${READ[e.id]?'on':''}"></span></a></li>`).join('')).join('')+
    `<li class="tp">맺음과 부록</li><li><a href="#/end"><span class="n">結</span><span>맺음: ${esc(DATA.meta.endT||'')}</span></a></li>`;
}
function openDrawer(o){$('#drawer').hidden=!o;$('#scrim').hidden=!o;$('#bToc').setAttribute('aria-expanded',String(o));}
$('#bToc').onclick=()=>openDrawer(true);$('#dclose').onclick=()=>openDrawer(false);$('#scrim').onclick=()=>openDrawer(false);
$('#toc').addEventListener('click',e=>{if(e.target.closest('a'))openDrawer(false);});

// ── 설정
let theme=store.get('theme','auto'),fs=store.get('fs',17);
const applyTheme=()=>{if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme);};
const isDark=()=>theme==='dark'||(theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
$('#bTheme').onclick=()=>{theme=isDark()?'light':'dark';store.set('theme',theme);applyTheme();};
const applyFs=()=>document.documentElement.style.setProperty('--fs',fs+'px');
$('#bFont').onclick=()=>{fs=fs>=20?15:fs+1;store.set('fs',fs);applyFs();};
applyTheme();applyFs();

// ── 지도 바탕
const NS='http://www.w3.org/2000/svg';
const base=(cls)=>`<path d="${DATA.grat}" fill="none" stroke="var(--grat)" stroke-width=".6" vector-effect="non-scaling-stroke"/><path d="${DATA.land}" fill="var(--land)" stroke="var(--landline)" stroke-width=".7" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path class="pv" d="${DATA.prov}" fill="none" vector-effect="non-scaling-stroke"/><path class="lk" d="${DATA.lakes}" vector-effect="non-scaling-stroke"/><path class="rv" d="${DATA.rivers}" fill="none" vector-effect="non-scaling-stroke"/><path class="bd" d="${DATA.borders}" fill="none" vector-effect="non-scaling-stroke"/>`;
const curve=(a,b,bend)=>{const mx=(a.mx+b.mx)/2,my=(a.my+b.my)/2,dx=b.mx-a.mx,dy=b.my-a.my,k=bend||.18;return `M${a.mx},${a.my} Q${mx-dy*k},${my+dx*k} ${b.mx},${b.my}`;};

// ════════ 화면들
function viewHome(){
  const n=DATA.events.length,M=DATA.meta,done=DATA.events.filter(e=>DATA.body[e.id]).length;
  main.innerHTML=`<div class="col hero"><p class="eyebrow">${esc(M.eyebrow)} · ${esc(M.span)}</p>
  <h1>${esc(M.title)}</h1><p class="sub">${esc(M.sub)}</p>
  ${M.guide?`<p class="note"><a href="guide.html" target="_blank" rel="noopener">처음이라면 「읽는 법」부터 →</a> 읽는 길과 화면·도구 사용법을 사진과 함께 안내합니다.</p>`:''}
  ${done<n?`<div class="keys"><p class="lbl">집필 중</p><p>${n}장 가운데 ${done}장의 본문이 쓰였습니다. 나머지 장은 물음과 핵심 요약, 앞뒤 장과의 연결이 먼저 채워져 있고, 본문은 부 단위로 이어서 씁니다.</p><div class="meter"><i style="width:${done/n*100}%"></i></div></div>`:''}
  ${M.intro.map(x=>`<p class="lede">${x}</p>`).join('')}
  <h2 class="sh">${esc(M.engn)}</h2>
  <p class="lede">${M.engines}</p>
  <div class="f3">${DATA.engines.map(([k,nm,d])=>`<div class="card"><h3>${esc(nm)}</h3><p>${esc(d)}</p></div>`).join('')}</div>
  <h2 class="sh">이 책을 읽는 길</h2>
  <div class="grid">
   <a class="card" href="#/p/p1"><h3>읽기</h3><p>부마다 배경 장으로 시대의 무대를 훑고, 사건 장을 차례로 읽습니다.</p></a>
   <a class="card" href="#/map"><h3>지도</h3><p>사건이 일어난 자리와, 원인과 결과가 무대를 넘나드는 길을 봅니다.</p></a>
   <a class="card" href="#/lanes"><h3>무대 연표</h3><p>${kn(DATA.regions.length)} 무대를 가로 레인으로 놓고 사건 사이의 화살표를 따라갑니다. 무대를 고르면 그 무대의 장만 이어 읽을 수 있습니다.</p></a>
   <a class="card" href="#/net/${DATA.events[0].id}"><h3>사건 연결망</h3><p>한 장씩, 그 사건을 낳은 원인과 그 사건이 낳은 결과를 이유와 함께 따라갑니다.</p></a>
   ${DATA.groups.length?`<a class="card" href="#/id"><h3>사람들의 변화</h3><p>${DATA.groups.map(g=>esc(g.n)).join(', ')}의 무엇이 어느 사건에서 바뀌었는지 모아 봅니다.</p></a>`:''}
   ${DATA.econ?`<a class="card" href="#/econ"><h3>경제 지표</h3><p>성장률과 주가, 환율과 실업률, 출산율을 시대의 흐름과 함께 그래프로 봅니다.</p></a><a class="card" href="#/air"><h3>시대의 공기</h3><p>부마다 그 시대의 말과 생활, 영화·소설·노래·애니메이션을 모아 봅니다.</p></a>`:''}${DATA.lineage.length?`<a class="card" href="#/ln"><h3>요소별 변천</h3><p>개념·상징·인물·도시·사람들 하나를 골라 그것이 거쳐 온 모습을 한 줄로 봅니다.</p></a>`:''}
   ${DATA.threads.length?`<a class="card" href="#/t"><h3>줄기</h3><p>${DATA.threads.map(x=>esc(x.n)).join(', ')}의 줄기를 시대를 건너 따라갑니다.</p></a>`:''}
   <a class="card" href="#/books"><h3>서가</h3><p>이 책이 기댄 책들과, 각 책이 받치는 장을 봅니다.</p></a>
  </div>
  <h2 class="sh">${esc(M.axn)}</h2>

function viewEcon(sid){
  const X=DATA.econ;if(!X){main.innerHTML='<div class="col"><p>경제 지표가 없습니다.</p></div>';return;}
  const Y0=1945,Y1=2012,W=1000,L=58,Rr=16,xs=y=>L+(y-Y0)/(Y1-Y0)*(W-L-Rr);
  const nice=(lo,hi,n)=>{const r=(hi-lo)/n,p=Math.pow(10,Math.floor(Math.log10(r))),s=[1,2,2.5,5,10].map(k=>k*p).find(k=>k>=r);const a=Math.floor(lo/s)*s,out=[];for(let v=a;v<=hi+1e-9;v+=s)out.push(+v.toFixed(6));return out;};
  const fmt=v=>Math.abs(v)>=1000?Math.round(v).toLocaleString('ko-KR'):String(+v.toFixed(2));
  const chart=s=>{
    const H=230,T=34,B=26,ih=H-T-B;const vals=s.data.map(d=>d[1]);
    let lo=Math.min(...vals),hi=Math.max(...vals);if(s.kind==='bar'){lo=Math.min(lo,0);hi=Math.max(hi,0);}
    let ticks,ys;
    if(s.log){const l0=Math.log10(lo),l1=Math.log10(hi);ys=v=>T+ih-(Math.log10(v)-l0)/(l1-l0)*ih;ticks=[100,300,1000,3000,10000,30000].filter(v=>v>=lo*0.8&&v<=hi*1.2);}
    else{ticks=nice(lo,hi,4);lo=Math.min(lo,ticks[0]);hi=Math.max(hi,ticks.at(-1));ys=v=>s.inv?T+(v-lo)/(hi-lo)*ih:T+ih-(v-lo)/(hi-lo)*ih;}
    const bands=DATA.parts.map(p=>`<rect x="${xs(p.y0)}" y="${T}" width="${xs(p.y1)-xs(p.y0)}" height="${ih}" fill="${pc(p.id)}" opacity=".07"/><text x="${(xs(p.y0)+xs(p.y1))/2}" y="${T+ih+18}" text-anchor="middle" style="fill:${pc(p.id)};font-weight:700">${esc(p.no)}</text>`).join('');
    const grid=ticks.map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L-6}" y="${ys(v)+4}" text-anchor="end">${fmt(v)}</text>`).join('');
    const mk=X.marks.map(([y,lab,id])=>`<line x1="${xs(y+.5)}" x2="${xs(y+.5)}" y1="${T}" y2="${T+ih}" stroke="var(--accent)" stroke-dasharray="2 3" opacity=".45"/>`).join('');

// ── 지도 화면: 왼쪽 지도, 오른쪽 목록·설명. 시대를 고르면 그 무대로 다가간다

const why=(a,b)=>(DATA.why||{})[a+'>'+b]||'';
const whyList=(ids,fn)=>ids.map(x=>`<li><a href="#/e/${x}"><span class="n" style="background:${ECOL(E[x])}">${E[x].no}</span> ${esc(E[x].t)} <small>${esc(E[x].y)}</small>${fn(x)?`<span class="why">${esc(fn(x))}</span>`:''}</a></li>`).join('');
function viewMap(sel){

   <div class="mtip" id="mtip" hidden></div>

   <aside class="mside" id="mside"></aside></div>
  <p class="note">바탕은 Natural Earth 자료로 그렸습니다. 회색 선은 오늘의 국경으로, 위치를 가늠하라고 희미하게 넣었습니다. ${esc((DATA.meta&&DATA.meta.mapnote)||'지도 밖에서 일어난 사건은 지도 가장자리에 기호로 표시했습니다.')} 같은 곳에 몰린 번호는 서로 비켜 놓았고, 가는 선이 실제 자리를 가리킵니다.</p></div>`;
  const svg=$('#msvg'),stage=$('#stage'),tip=$('#mtip');
  let lay=store.get('maplay',{bd:true,prov:true,rivers:true,ports:true,lease:true});
  const paintLay=()=>{MAPLAY.forEach(([k])=>{stage.classList.toggle('no'+(k==='bd'?'borders':k),!lay[k]);});document.querySelectorAll('[data-lay]').forEach(b=>b.classList.toggle('on',!!lay[b.dataset.lay]));};
  document.querySelectorAll('[data-lay]').forEach(b=>b.onclick=()=>{lay[b.dataset.lay]=!lay[b.dataset.lay];store.set('maplay',lay);paintLay();});
  paintLay();
  const inPart=e=>mapState.part==='all'||e.p===mapState.part;
  const fit=list=>{if(!list.length)return [0,0,W,H];let x0=Math.min(...list.map(e=>e.mx)),x1=Math.max(...list.map(e=>e.mx)),y0=Math.min(...list.map(e=>e.my)),y1=Math.max(...list.map(e=>e.my));
    let w=Math.max(x1-x0+140,W/5),h=Math.max(y1-y0+110,H/5);const cx=(x0+x1)/2,cy=(y0+y1)/2;if(w/h>W/H)h=w*H/W;else w=h*W/H;if(w>W){w=W;h=H;}return clampVB([cx-w/2,cy-h/2,w,h]);};

      <ol class="mlist">${list.map(e=>`<li><button data-go="${e.id}"><span class="n" style="background:${ECOL(e)}">${e.no}</span><span><b>${esc(e.t)}</b><small>${esc(e.y)} · ${esc(e.pl[0])}</small></span></button></li>`).join('')}</ol>`;

  }
  function hl(id,on){const g=$('#mks').querySelector(`[data-id="${id}"]`);if(g)g.classList.toggle('hov',on);}
  function pick(id,move){mapState.sel=id;setH('#/map/'+id);if(move){const s=E[id];mapState.vb=fit([s,...s.pv.map(x=>E[x]),...s.nx.map(x=>E[x])]);}setVB();$('#mside').scrollTop=0;}
  let PS={};

    const own=DATA.events.filter(inPart),ext=sel?[...sel.pv,...sel.nx].map(x=>E[x]).filter(e=>!inPart(e)):[];
    const list=[...own,...ext.filter((e,i,a)=>a.indexOf(e)===i)];
    const pts=list.map(e=>({e,x:e.mx,y:e.my}));
    for(let it=0;it<60;it++){let mv=0;for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);const m=2.15*r;if(d<m){if(d<1e-6){dx=Math.cos(i+j);dy=Math.sin(i+j);d=1;}const f=(m-d)/2/d;a.x-=dx*f;a.y-=dy*f;b.x+=dx*f;b.y+=dy*f;mv++;}}

    const arc=(a,b,cls)=>{const A=PS[a.id],B=PS[b.id];if(!A||!B)return '';const q={mx:A.x,my:A.y},t={mx:B.x,my:B.y};const dx=t.mx-q.mx,dy=t.my-q.my,d=Math.hypot(dx,dy)||1;const t2={mx:t.mx-dx/d*r*1.15,my:t.my-dy/d*r*1.15};

    const kz=mapState.vb[2]/W;document.querySelectorAll('#mlab .lbl-reg').forEach(t=>t.style.fontSize=Math.max(15*kz,5)+'px');document.querySelectorAll('#mlab .lbl-sea').forEach(t=>t.style.fontSize=Math.max(12*kz,4)+'px');

     <g class="lay-lease">${ls.map(q=>`<rect x="${q.xy[0]-3.6*kz}" y="${q.xy[1]-3.6*kz}" width="${7.2*kz}" height="${7.2*kz}"><title>${esc(q.n)} · ${esc(q.who)} · ${q.y}–${q.until>2100?'':q.until}</title></rect>${kz<.8?`<text x="${q.xy[0]+6*kz}" y="${q.xy[1]-5*kz}" style="font-size:${8.5*kz}px">${esc(q.n)}(${esc(q.who)})</text>`:''}`).join('')}</g>`;
    side();
  }
  const showTip=g=>{const e=E[g.dataset.id],c=g.querySelector('circle').getBoundingClientRect(),s=stage.getBoundingClientRect();

    const x=c.left-s.left+c.width/2,y=c.top-s.top;tip.style.left=Math.min(Math.max(x,90),s.width-90)+'px';tip.style.top=Math.max(y-6,4)+'px';};
  $('#mks').addEventListener('pointerover',ev=>{const g=ev.target.closest('.mk');if(g)showTip(g);});

// ── 지역 연표: 시간축은 사건 밀도에 맞춰 늘리고 줄인다(사건 사이 간격을 고르게)

    const p={x,y:ly(r)+off,off};L.push(p);last[r]=L.filter(q=>x-q.x<40);pos[e.id][r]=p;});});

const allCh=()=>DATA.groups.flatMap(g=>g.ch.map(([ev,ax,t])=>({g,e:E[ev],ax,t})));
function heat(click){
  const cnt={};DATA.groups.forEach(g=>g.ch.forEach(([ev,ax])=>{const k=ax+'|'+E[ev].p;cnt[k]=(cnt[k]||0)+1;}));
  const mx=Math.max(...Object.values(cnt));
  return `<table class="tbl heat"><thead><tr><th>축 \\ 시대</th>${DATA.parts.map(p=>`<th title="${esc(p.t)}">${esc(p.no)}<small>${esc(p.t)}</small></th>`).join('')}</tr></thead><tbody>
  ${DATA.axes.map(a=>`<tr><th><a href="#/axis/${a.id}">${esc(a.n)}</a></th>${DATA.parts.map(p=>{const v=cnt[a.id+'|'+p.id]||0;const bg=`background:color-mix(in srgb,var(--accent) ${Math.round(v/mx*55)}%,transparent)`;
    return `<td class="v" style="${bg}">${click&&v?`<button data-cell="${a.id}|${p.id}" aria-label="${esc(a.n)}, ${esc(p.no)}: ${v}건 보기">${v}</button>`:(v||'')}</td>`;}).join('')}</tr>`).join('')}</tbody></table>`;
}
function heatReading(){
  const cnt={};allCh().forEach(c=>{const k=c.ax+'|'+c.e.p;cnt[k]=(cnt[k]||0)+1;});
  const by={};DATA.axes.filter(a=>a.id!=='blood').forEach(a=>{const best=DATA.parts.reduce((m,p)=>(cnt[a.id+'|'+p.id]||0)>(cnt[a.id+'|'+m.id]||0)?p:m,DATA.parts[0]);(by[best.id]=by[best.id]||[]).push(a.n);});
  return DATA.parts.filter(p=>by[p.id]).map(p=>`${by[p.id].join('과 ')}${/[가-힣]$/.test(by[p.id].at(-1))&&((by[p.id].at(-1).charCodeAt(by[p.id].at(-1).length-1)-0xAC00)%28)?'은':'는'} ${p.no}(${p.t})`).join(', ');
}

function partBands(sx,lo,hi){const ext=DATA.parts.map(p=>{const xs=p.ev.map(e=>sx(e.yr));return [Math.min(...xs),Math.max(...xs)];});
  return DATA.parts.map((p,i)=>({p,i,x0:i?(ext[i-1][1]+ext[i][0])/2:lo,x1:i<ext.length-1?(ext[i][1]+ext[i+1][0])/2:hi}));}

// ── 밑줄: 본문에서 글을 골라 밑줄을 긋고, 다시 열면 그 자리에 다시 그린다. 모음 화면에서 한꺼번에 본다.
const UL=(function(){
  let LIST=store.get('ul',[]);
  const save=()=>store.set('ul',LIST);
  const pageKey=()=>{const h=CUR.replace(/^#\/?/,'').split('/');const v=h[0]||'';
    if(v==='e'&&E[h[1]])return '#/e/'+h[1];if(['p','ln','pp'].includes(v)&&h[1])return `#/${v}/${h[1]}`;if(v==='end')return '#/end';return null;};
  const pageName=k=>{const [,v,a]=k.split('/');if(v==='e'&&E[a])return `제${E[a].no}장 ${E[a].t}`;if(v==='p'&&P[a])return `${P[a].no} 배경`;if(v==='ln'&&LN[a])return `변천: ${LN[a].n}`;if(v==='pp'&&PE[a])return `인물: ${PE[a].n}`;if(v==='end')return '맺음';return k;};
  const SKIP='.secbar,.ctools,.ulbar,button,select,nav,svg,script,style,.pn,.go,.ctrl,.lnflow,.trail,.how';
  function texts(root){const out=[];const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||!n.nodeValue)return NodeFilter.FILTER_REJECT;if(p.closest(SKIP))return NodeFilter.FILTER_REJECT;if(p.closest('.term'))return NodeFilter.FILTER_ACCEPT;return NodeFilter.FILTER_ACCEPT;}});let n,pos=0;while((n=w.nextNode())){out.push({n,s:pos});pos+=n.nodeValue.length;}return out;}
  const root=()=>main.querySelector('article')||main.querySelector('.col')||main;
  // 선택 범위를 전체 글 속의 위치로
  function offsetOf(nodes,node,off){if(node.nodeType!==3){const c=node.childNodes[off];if(c){const w=document.createTreeWalker(c,NodeFilter.SHOW_TEXT);const t=w.nextNode()||null;if(t){node=t;off=0;}}else{const w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let t,l=null;while((t=w.nextNode()))l=t;if(l){node=l;off=l.nodeValue.length;}}}
    const it=nodes.find(x=>x.n===node);return it?it.s+off:-1;}
  function wrap(nodes,a,b,id){
    for(const {n,s} of nodes){const e=s+n.nodeValue.length;if(e<=a||s>=b)continue;
      const x=Math.max(a,s)-s,y=Math.min(b,e)-s;let t=n;if(x>0)t=t.splitText(x);if(y-x<t.nodeValue.length)t.splitText(y-x);
      if(!t.nodeValue.trim())continue;const m=document.createElement('mark');m.className='ul';m.dataset.u=id;t.parentNode.insertBefore(m,t);m.appendChild(t);}
  }
  function paint(){
    const k=pageKey();if(!k)return;const items=LIST.filter(x=>x.k===k);if(!items.length)return;
    const r=root();
    for(const it of items){const nodes=texts(r),full=nodes.map(x=>x.n.nodeValue).join('');
      let best=-1,score=-1,i=-1;while((i=full.indexOf(it.q,i+1))>=0){const sc=(full.slice(Math.max(0,i-it.pre.length),i)===it.pre?2:0)+(full.slice(i+it.q.length,i+it.q.length+it.suf.length)===it.suf?1:0);if(sc>score){score=sc;best=i;}if(sc===3)break;}
      if(best>=0)wrap(nodes,best,best+it.q.length,it.id);else it.lost=1;}
  }
  // 떠 있는 단추
  const bar=document.createElement('div');bar.className='ulbar';bar.hidden=true;bar.setAttribute('role','toolbar');
  document.body.appendChild(bar);let pend=null,curMark=null;
  const sm=()=>matchMedia('(hover:none),(max-width:680px)').matches;
  function place(rect){bar.hidden=false;const bw=bar.offsetWidth,bh=bar.offsetHeight;
    if(sm()){bar.classList.add('dock');bar.style.left='';bar.style.top='';return;}
    bar.classList.remove('dock');let x=rect.left+rect.width/2-bw/2,y=rect.top-bh-10;if(y<70)y=rect.bottom+10;
    bar.style.left=Math.max(8,Math.min(innerWidth-bw-8,x))+'px';bar.style.top=y+'px';}
  function hide(){bar.hidden=true;pend=null;curMark=null;}
  function onSel(){
    if(!pageKey())return hide();const sel=getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount){if(!curMark)hide();return;}
    const rg=sel.getRangeAt(0),r=root();if(!r.contains(rg.commonAncestorContainer))return hide();
    const q=sel.toString();if(q.replace(/\s/g,'').length<2)return hide();
    const nodes=texts(r),a=offsetOf(nodes,rg.startContainer,rg.startOffset),b=offsetOf(nodes,rg.endContainer,rg.endOffset);if(a<0||b<=a)return hide();
    const full=nodes.map(x=>x.n.nodeValue).join('');
    pend={a,b,q:full.slice(a,b),pre:full.slice(Math.max(0,a-24),a),suf:full.slice(b,b+24)};curMark=null;
    bar.innerHTML=`<button type="button" class="ub-add">밑줄 긋기</button>`;place(rg.getBoundingClientRect());
  }
  let st;document.addEventListener('selectionchange',()=>{clearTimeout(st);st=setTimeout(onSel,sm()?350:120);});
  bar.addEventListener('pointerdown',ev=>ev.preventDefault());
  bar.addEventListener('mousedown',ev=>ev.preventDefault());
  bar.addEventListener('click',ev=>{
    if(ev.target.closest('.ub-add')&&pend){const k=pageKey();const id='u'+Date.now().toString(36);
      const it={id,k,q:pend.q.trim()?pend.q:pend.q,pre:pend.pre,suf:pend.suf,t:Date.now()};
      // 앞뒤 공백은 빼고 위치를 맞춘다
      const lead=it.q.length-it.q.trimStart().length,trail=it.q.length-it.q.trimEnd().length;
      if(lead||trail){it.pre=(it.pre+it.q.slice(0,lead)).slice(-24);it.suf=(it.q.slice(it.q.length-trail)+it.suf).slice(0,24);it.q=it.q.trim();}
      LIST.push(it);save();const nodes=texts(root());wrap(nodes,pend.a+lead,pend.b-trail,id);getSelection().removeAllRanges();hide();say('밑줄을 그었습니다 · 모음은 처음 화면에서');}
    else if(ev.target.closest('.ub-del')&&curMark){const id=curMark;LIST=LIST.filter(x=>x.id!==id);save();
      main.querySelectorAll(`mark.ul[data-u="${id}"]`).forEach(m=>{const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);m.remove();p.normalize();});hide();say('밑줄을 지웠습니다');}
    else if(ev.target.closest('.ub-all')){hide();nav('#/ul');}
  });
  // 그어진 밑줄을 누르면 지우기
  main.addEventListener('click',ev=>{const m=ev.target.closest('mark.ul');if(!m||ev.target.closest('.term'))return;const sel=getSelection();if(sel&&!sel.isCollapsed)return;
    curMark=m.dataset.u;pend=null;bar.innerHTML=`<button type="button" class="ub-del">밑줄 지우기</button><button type="button" class="ub-all">밑줄 모음</button>`;place(m.getBoundingClientRect());});
  document.addEventListener('click',ev=>{if(!bar.hidden&&curMark&&!ev.target.closest('.ulbar')&&!ev.target.closest('mark.ul'))hide();});
  addEventListener('scroll',()=>{if(!bar.hidden&&!sm()&&curMark)hide();},{passive:true});
  const toast=m=>{const t=document.querySelector('.toast');if(!t)return;t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800);};const say=toast;
  let jumpTo=null;
  document.addEventListener('routed',()=>{hide();paint();if(jumpTo){const m=main.querySelector(`mark.ul[data-u="${jumpTo}"]`);jumpTo=null;if(m){const bh=(document.querySelector('.bar')||{}).offsetHeight||0;setTimeout(()=>{window.scrollTo({top:m.getBoundingClientRect().top+curY()-bh-90});m.classList.add('flash');setTimeout(()=>m.classList.remove('flash'),1600);},60);}}});
  function view(){
    const groups={};LIST.slice().sort((a,b)=>b.t-a.t).forEach(x=>(groups[x.k]=groups[x.k]||[]).push(x));
    const keys=Object.keys(groups);
    main.innerHTML=`<div class="col"><p class="eyebrow">내 서재</p><h1 class="vt">밑줄 모음</h1>
    <p class="lede">본문에서 글을 길게 눌러(PC에서는 끌어서) 고르면 ‘밑줄 긋기’ 단추가 나타납니다. 그은 밑줄은 이 기기의 브라우저에 저장되고, 여기에 장별로 모입니다. 밑줄을 다시 누르면 지울 수 있습니다.</p>
    ${keys.length?`<div class="go"><button type="button" class="pill" id="ulcopy">모두 글로 복사</button><span class="note" style="margin:0 .3rem">${LIST.length}개</span></div>`+keys.map(k=>`<section class="ulgrp"><h2 class="sh"><a href="${k}">${esc(pageName(k))}</a></h2><ul class="ullist">${groups[k].map(x=>`<li><a href="${k}" data-jump="${x.id}"><mark class="ul">${esc(x.q)}</mark></a><span class="ulm">${new Date(x.t).toLocaleDateString('ko-KR')}${x.lost?' · 본문이 바뀌어 위치를 찾지 못함':''}</span><button type="button" class="pill ul-x" data-x="${x.id}" aria-label="이 밑줄 지우기">지우기</button></li>`).join('')}</ul></section>`).join(''):`<div class="card"><p>아직 그은 밑줄이 없습니다. 아무 장이나 열어 마음에 남는 문장을 골라 보세요.</p><p><a href="#/p/p1">제1부부터 읽기 →</a></p></div>`}</div>`;
    main.querySelector('.col').onclick=ev=>{const j=ev.target.closest('[data-jump]');if(j){jumpTo=j.dataset.jump;return;}
      const x=ev.target.closest('[data-x]');if(x){LIST=LIST.filter(y=>y.id!==x.dataset.x);save();view();say('밑줄을 지웠습니다');}
      if(ev.target.closest('#ulcopy')){const txt=keys.map(k=>`■ ${pageName(k)}\n`+groups[k].map(x=>`  · ${x.q}`).join('\n')).join('\n\n');
        (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>say('밑줄을 모두 복사했습니다'),()=>say('복사하지 못했습니다'));}};
  }
  return {view,count:()=>LIST.length};
})();

// ── 길잡이
let CUR=(()=>{try{return location.hash}catch(e){return ''}})();
// 기록의 한 칸마다 {y:떠날 때의 스크롤 자리, d:이 탭에서의 깊이}를 적어 두고, 뒤로·앞으로 오면 그 자리로 돌아간다
try{history.scrollRestoration='manual'}catch(e){}
const HS=()=>(history.state&&typeof history.state==='object')?history.state:{};
let DEPTH=HS().d||0;
const curY=()=>window.scrollY||document.documentElement.scrollTop||0;
function saveY(){try{history.replaceState(Object.assign({},HS(),{y:curY(),d:DEPTH}),'',location.href)}catch(e){}}
function setH(h){CUR=h;try{history.replaceState(Object.assign({},HS(),{d:DEPTH}),'',h)}catch(e){}}
function nav(h){if(h===CUR){route();return;}saveY();CUR=h;DEPTH++;try{history.pushState({y:0,d:DEPTH},'',h)}catch(e){}route();}
addEventListener('popstate',ev=>{try{CUR=location.hash}catch(e){}const st=ev.state||{};DEPTH=st.d||0;route(st.y||0);});

function restoreY(y){const go=()=>window.scrollTo({top:y,left:0,behavior:'instant'});go();requestAnimationFrame(go);let n=0;const t=setInterval(()=>{go();if(++n>5||Math.abs(curY()-y)<2)clearInterval(t);},80);
  const stop=()=>{clearInterval(t);['wheel','touchstart','keydown'].forEach(x=>removeEventListener(x,stop,true));};['wheel','touchstart','keydown'].forEach(x=>addEventListener(x,stop,{capture:true,passive:true}));}
function route(restore){

  else if(v==='net'){viewNet(a);tab='net';}
  else if(v==='id'){viewId(a);tab='id';}

  else if(v==='econ'){viewEcon(a);tab='econ';}
  else if(v==='air'){viewAir(a);tab='air';}
  else if(v==='ul'){UL.view();tab='home';}
  else if(v==='r'){viewTrail(a);tab='lanes';}

  document.querySelectorAll('#tabs a').forEach(x=>x.classList.toggle('on',x.dataset.v===tab));
  buildToc(cur);
  if(typeof restore==='number')restoreY(restore);else if(!(v==='books'&&a))window.scrollTo(0,0);
  document.dispatchEvent(new CustomEvent('routed',{detail:{v,a,cur}}));
  const t=cur&&E[cur]?E[cur].t:cur&&P[cur]?P[cur].t:v==='ln'&&LN[a]?LN[a].n+' · 요소별 변천':v==='ln'?'요소별 변천':v==='ul'?'밑줄 모음':v==='pp'&&PE[a]?PE[a].n+' · 인물':v==='pp'?'인물':'';document.title=(t?t+' · ':'')+DATA.meta.title;
}

  const toast=document.createElement('div');toast.className='toast';toast.setAttribute('role','status');toast.hidden=true;document.body.appendChild(toast);
  let tt;const say=m=>{toast.textContent=m;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,1800);};
  let lastY=curY(),acc=0;
  function syncFab(){const y=curY();fBack.hidden=!(DEPTH>0);fTop.hidden=y<700;}
  addEventListener('scroll',()=>{const y=curY(),dy=y-lastY;lastY=y;syncFab();
    const root=document.documentElement;
    if(!sm()||y<160||y+innerHeight>=document.documentElement.scrollHeight-40){acc=0;root.classList.remove('fab-away');}
    else{acc=Math.sign(dy)===Math.sign(acc)?acc+dy:dy;if(acc>70)root.classList.add('fab-away');else if(acc<-30)root.classList.remove('fab-away');}
    secSync();},{passive:true});
  // Esc·Backspace: 열린 창이 없으면 직전 위치로
  addEventListener('keydown',ev=>{
    if(ev.key!=='Escape'&&ev.key!=='Backspace')return;if(ev.altKey||ev.ctrlKey||ev.metaKey)return;
    const t=ev.target,tag=(t&&t.tagName)||'';if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable))return;
    const open=!$('#results').hidden||!$('#pop').hidden||!$('#drawer').hidden||document.querySelector('.secmenu:not([hidden])');
    if(open)return;
    if(DEPTH>0){ev.preventDefault();history.back();}
  },true);

  // 2) 지금 읽는 절 띠 (긴 글: 사건 장·배경 장·결론·지역 통사)
  let secs=[],bar=null;
  const barH=()=>{const b=document.querySelector('.bar');return b?b.getBoundingClientRect().height:0;};
  function secBuild(v){
    bar=null;secs=[];
    if(!['e','p','end','ln'].includes(v))return;
    const art=main.querySelector('article, .col');if(!art)return;
    const sel=v==='e'?'section.keys.guide>.lbl, .slot>h2, aside.box>.lbl':v==='p'?'.slot>h2, h2.sh, .slot .rh>h4':v==='end'?'h2.sh, .rh>h4':v==='ln'?'.slot>h2, h2.sh':'section.part>h3';
    const hs=[...art.querySelectorAll(sel)].filter(h=>h.offsetParent!==null);
    if(hs.length<3)return;
    secs=hs.map((h,i)=>{h.id=h.id||'sec-'+i;h.classList.add('sec-anchor');return {el:h,t:h.textContent.replace(/\s+/g,' ').split(/[:：]/)[0].trim().slice(0,28)};});
    bar=document.createElement('div');bar.className='secbar';
    bar.innerHTML=`<button type="button" class="sb-cur" aria-haspopup="true" aria-expanded="false"><span class="sb-lab"></span><span aria-hidden="true">▾</span></button><span class="sb-prog" aria-hidden="true"><i></i></span><ol class="secmenu" hidden>${secs.map((s,i)=>`<li><button type="button" data-i="${i}">${esc(s.t)}</button></li>`).join('')}</ol>`;
    const tr=art.querySelector(':scope>.trail');if(tr)tr.after(bar);else art.prepend(bar);
    const btn=bar.querySelector('.sb-cur'),menu=bar.querySelector('.secmenu');
    btn.onclick=ev=>{ev.stopPropagation();menu.hidden=!menu.hidden;btn.setAttribute('aria-expanded',String(!menu.hidden));};
    menu.onclick=ev=>{const b=ev.target.closest('button[data-i]');if(!b)return;menu.hidden=true;btn.setAttribute('aria-expanded','false');
      const el=secs[+b.dataset.i].el;window.scrollTo({top:el.getBoundingClientRect().top+curY()-barH()-56,behavior:'smooth'});};
    document.addEventListener('click',ev=>{if(bar&&!ev.target.closest('.secbar'))menu.hidden=true;});
    secSync();
  }
  function secSync(){
    if(!bar||!secs.length)return;
    const off=barH()+70;let k=-1;
    secs.forEach((s,i)=>{if(s.el.getBoundingClientRect().top<=off)k=i;});
    const top=bar.parentElement.getBoundingClientRect().top+curY(),h=bar.parentElement.offsetHeight;
    const p=Math.min(1,Math.max(0,(curY()-top+innerHeight*.3)/Math.max(1,h-innerHeight*.7)));
    bar.querySelector('.sb-lab').textContent=k<0?'이 장의 차례':secs[k].t;
    bar.querySelector('.sb-prog i').style.width=(p*100).toFixed(1)+'%';
    bar.classList.toggle('stuck',bar.getBoundingClientRect().top<=barH()+1);
    bar.querySelectorAll('.secmenu button').forEach((b,i)=>b.classList.toggle('on',i===k));
  }
  addEventListener('resize',()=>{document.documentElement.style.setProperty('--barh',barH()+'px');secSync();});

  // 3) 책갈피·링크 복사·이어 읽기
  let MARKS=store.get('marks',[]);
  const isMarked=id=>MARKS.includes(id);
  const toggleMark=id=>{MARKS=isMarked(id)?MARKS.filter(x=>x!==id):[id,...MARKS];store.set('marks',MARKS);};
  const pageUrl=h=>location.href.split('#')[0]+h;
  async function copy(txt){try{await navigator.clipboard.writeText(txt);return true;}catch(e){
    try{const t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok;}catch(_){return false;}}}
  function chapterTools(id){
    const head=main.querySelector('.chead');if(!head||head.querySelector('.ctools'))return;
    const d=document.createElement('div');d.className='ctools';
    const paint=()=>{d.innerHTML=`<button type="button" class="tb tb-mark" aria-pressed="${isMarked(id)}">${isMarked(id)?'★ 책갈피에 있음':'☆ 책갈피'}</button><button type="button" class="tb tb-link">링크 복사</button><a class="tb" href="#/ul">밑줄 모음</a>`;};
    paint();head.appendChild(d);
    d.onclick=async ev=>{
      if(ev.target.closest('.tb-mark')){toggleMark(id);paint();say(isMarked(id)?'책갈피에 넣었습니다':'책갈피에서 뺐습니다');}
      if(ev.target.closest('.tb-link')){const ok=await copy(pageUrl('#/e/'+id));say(ok?'이 장의 링크를 복사했습니다':'복사하지 못했습니다');}
    };
  }
  let lastSave=0;
  addEventListener('scroll',()=>{const c=(CUR.match(/^#\/e\/(\w+)/)||[])[1];if(!c||!E[c])return;const n=Date.now();if(n-lastSave<600)return;lastSave=n;store.set('last',{id:c,h:CUR,y:curY()});},{passive:true});
  function homeShelf(){
    const hero=main.querySelector('.hero');if(!hero||hero.querySelector('.shelf'))return;
    const last=store.get('last',null),marks=MARKS.filter(id=>E[id]);
    const nul=UL.count();if(!(last&&E[last.id])&&!marks.length&&!nul)return;
    const d=document.createElement('div');d.className='shelf';
    d.innerHTML=(last&&E[last.id]?`<a class="resume" href="${esc(last.h||'#/e/'+last.id)}" data-y="${last.y||0}"><span class="rs"><small>읽던 곳 이어 읽기</small><b>제${E[last.id].no}장 ${esc(E[last.id].t)}</b></span><span aria-hidden="true">→</span></a>`:'')+
      (marks.length?`<div class="marks"><span class="lb">책갈피</span>${marks.map(id=>`<a class="chip" href="#/e/${id}">${E[id].no}. ${esc(E[id].t)}</a>`).join('')}</div>`:'')+
      (nul?`<div class="marks"><span class="lb">밑줄</span><a class="chip" href="#/ul">밑줄 모음 ${nul}개</a></div>`:'');
    const sub=hero.querySelector('.sub');(sub||hero.firstElementChild).after(d);
    const r=d.querySelector('.resume');if(r)r.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();const y=+r.dataset.y||0;nav(r.getAttribute('href'));restoreY(y);},true);
  }

  document.addEventListener('routed',ev=>{
    const {v,cur}=ev.detail;
    document.documentElement.style.setProperty('--barh',barH()+'px');
    document.documentElement.classList.remove('fab-away');
    if(v==='e'&&cur&&E[cur])chapterTools(cur);
    if(!v)homeShelf();
    secBuild(v);syncFab();
  });
})();

route(typeof HS().y==='number'?HS().y:undefined);
})();
</script>
</body>
</html>
